name: Build Apple NCM user-mode prototype
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apple-ncm-userspace.yml'
      - 'ci/userspace/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          repository: HexBen123/apple-ncm-tap-windows
          ref: a3d6f3334aa7a772201177d00ebc127cd29f8f63
          path: bridge
      - name: Apply PID1905 adaptation
        shell: pwsh
        run: |
          git -C bridge apply --check ../automation/ci/userspace/1905.patch
          if ($LASTEXITCODE) { throw 'Patch validation failed' }
          git -C bridge apply ../automation/ci/userspace/1905.patch
          if ($LASTEXITCODE) { throw 'Patch failed' }
      - name: Build and run offline tests
        shell: powershell
        run: |
          & ./bridge/usermode-probe/build.ps1 -Arch x64
          & ./bridge/usermode-probe/test-codec.ps1 -Arch x64
          & ./bridge/usermode-probe/out/x64/ncm_probe.exe --help
          if ($LASTEXITCODE) { throw 'CLI help failed' }
      - name: Assemble and verify package
        shell: powershell
        run: '& ./automation/ci/userspace/package.ps1'
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-NCM-Usermode-Windows-x64
          path: package/*
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apple-NCM-Usermode-Verification
          path: verification/*
          retention-days: 30
